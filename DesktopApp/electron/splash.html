<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Cafevania Gourmet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.6s ease-out;
    }

    /* Logo */
    .logo-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
    }

    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 28px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      animation: pulseRing 2s ease-in-out infinite;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 
        0 20px 60px rgba(205, 164, 52, 0.4),
        0 0 0 1px rgba(205, 164, 52, 0.2);
      position: relative;
      z-index: 1;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Text */
    .app-name {
      font-size: 28px;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .app-subtitle {
      font-size: 13px;
      color: rgba(148, 163, 184, 0.8);
      margin-top: -20px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Progress */
    .progress-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 280px;
    }

    .progress-bar-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #818cf8);
      border-radius: 4px;
      animation: progressAnim 2.5s ease-in-out infinite;
    }

    .progress-text {
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
      font-weight: 500;
    }

    .progress-dots::after {
      content: '';
      animation: dots 1.5s infinite steps(4);
    }

    /* Version */
    .version {
      position: fixed;
      bottom: 20px;
      font-size: 11px;
      color: rgba(100, 116, 139, 0.4);
      font-family: monospace;
      letter-spacing: 1px;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.6; }
    }

    @keyframes progressAnim {
      0% { width: 5%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 5%; margin-left: 95%; }
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="logo-ring"></div>
      <div class="logo">
        <img src="../public/logo.jpg" alt="Cafevania Gourmet" />
      </div>
    </div>

    <div class="app-name">Cafevania Gourmet</div>
    <div class="app-subtitle">Kassa Sistemi</div>

    <div class="progress-section">
      <div class="progress-bar-track">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="progress-text">Sistem yüklənir<span class="progress-dots"></span></div>
    </div>
  </div>

  <div class="version">v1.0.0</div>
</body>
</html>
