</div>

</button>
<span class="text-lg font-bold text-slate-900 dark:text-white min-w-[1ch] text-center">2</span>
<button class="size-8 flex items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-primary/30 transition-active active:scale-95">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>

</div>

</button>
</div>
</div>
</div>

<span class="material-symbols-outlined">send</span>
