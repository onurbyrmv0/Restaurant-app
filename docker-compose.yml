services:
  kassa-panel:
    build:
      context: ./DesktopApp
      dockerfile: Dockerfile
    container_name: cafevania-kassa-web
    ports:
      - "9001:80"
    restart: always

  waiter-app:
    build:
      context: ./MobileApp
      dockerfile: Dockerfile
    container_name: cafevania-waiter-web
    ports:
      - "9002:80"
    restart: always
